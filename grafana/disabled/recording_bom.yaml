apiVersion: 1

# Recording rule GRAFANA-MANAGED per il consumo BOM "al minuto".
#
# Perche' Grafana-managed (e non rule Prometheus): le regole di registrazione
# vivono e vengono valutate in Grafana, coerentemente con alert e dashboard.
# Grafana valuta ogni query ogni minuto (interval: 1m) e ne scrive il risultato
# su Prometheus via remote-write (target_datasource_uid: prometheus). Serve
# quindi Prometheus avviato con --web.enable-remote-write-receiver e, lato
# Grafana, [recording_rules].default_datasource_uid = prometheus.
#
# Semantica: sagra_qt_totale e' un totale CUMULATIVO per articolo; il consumo
# del minuto e' la differenza fra il totale ordinato "ora" e quello di "un
# minuto fa" (offset 1m), aggregato secondo i pesi BOM. clamp_min(..., 0) evita
# valori negativi al reset dei contatori del gestionale (es. cambio giornata).
# Ogni serie sagra:consumo_1m:<bom> ha 1 campione al minuto e alimenta i
# barchart delle dashboard Primi/Secondi.
#
# Fallback a zero: `or vector(0)` e' applicato a OGNI singolo termine
# sum(sagra_qt_totale{...}) (sia "ora" sia "offset 1m"), non solo al risultato
# finale. Motivo: a inizio serata (o finche' un articolo non viene mai
# ordinato) la sua serie non esiste; senza fallback per-termine l'intera somma
# diventerebbe vuota e la regola registrerebbe 0 anche quando gli altri
# articoli del BOM stanno consumando. Con il fallback ogni articolo mancante
# vale 0 e il consumo degli altri viene contabilizzato correttamente.
#
# File senza soglie: passa da tools/render.py solo per uniformita' (nessun
# segnaposto tra doppi percento da interpolare).

groups:
  - orgId: 1
    name: Consumo BOM (registrazione 1m)
    folder: Sagra
    interval: 1m
    rules:
      # --- Primi ---
      - uid: sagra-rec-lasagne
        title: Consumo 1m — lasagne
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              expr: 'clamp_min(((sum(sagra_qt_totale{id="36"}) or vector(0)) + (3/7) * (sum(sagra_qt_totale{id="37"}) or vector(0))) - ((sum(sagra_qt_totale{id="36"} offset 1m) or vector(0)) + (3/7) * (sum(sagra_qt_totale{id="37"} offset 1m) or vector(0))), 0) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
        record:
          metric: sagra:consumo_1m:lasagne
          from: A
          target_datasource_uid: prometheus
        for: 0s

      - uid: sagra-rec-tortelli-ricotta
        title: Consumo 1m — tortelli ricotta
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              expr: 'clamp_min((8 * (sum(sagra_qt_totale{id="409"}) or vector(0)) + 3 * (sum(sagra_qt_totale{id="416"}) or vector(0)) + 3 * (sum(sagra_qt_totale{id="441"}) or vector(0)) + 3 * (sum(sagra_qt_totale{id="37"}) or vector(0))) - (8 * (sum(sagra_qt_totale{id="409"} offset 1m) or vector(0)) + 3 * (sum(sagra_qt_totale{id="416"} offset 1m) or vector(0)) + 3 * (sum(sagra_qt_totale{id="441"} offset 1m) or vector(0)) + 3 * (sum(sagra_qt_totale{id="37"} offset 1m) or vector(0))), 0) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
        record:
          metric: sagra:consumo_1m:tortelli_ricotta
          from: A
          target_datasource_uid: prometheus
        for: 0s

      - uid: sagra-rec-tortelli-zucca
        title: Consumo 1m — tortelli zucca
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              expr: 'clamp_min((8 * (sum(sagra_qt_totale{id="370"}) or vector(0)) + 8 * (sum(sagra_qt_totale{id="151"}) or vector(0)) + 3 * (sum(sagra_qt_totale{id="416"}) or vector(0)) + 3 * (sum(sagra_qt_totale{id="441"}) or vector(0))) - (8 * (sum(sagra_qt_totale{id="370"} offset 1m) or vector(0)) + 8 * (sum(sagra_qt_totale{id="151"} offset 1m) or vector(0)) + 3 * (sum(sagra_qt_totale{id="416"} offset 1m) or vector(0)) + 3 * (sum(sagra_qt_totale{id="441"} offset 1m) or vector(0))), 0) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
        record:
          metric: sagra:consumo_1m:tortelli_zucca
          from: A
          target_datasource_uid: prometheus
        for: 0s

      - uid: sagra-rec-tortelli-speck
        title: Consumo 1m — tortelli speck
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              expr: 'clamp_min((8 * (sum(sagra_qt_totale{id="369"}) or vector(0)) + 3 * (sum(sagra_qt_totale{id="416"}) or vector(0)) + 3 * (sum(sagra_qt_totale{id="441"}) or vector(0))) - (8 * (sum(sagra_qt_totale{id="369"} offset 1m) or vector(0)) + 3 * (sum(sagra_qt_totale{id="416"} offset 1m) or vector(0)) + 3 * (sum(sagra_qt_totale{id="441"} offset 1m) or vector(0))), 0) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
        record:
          metric: sagra:consumo_1m:tortelli_speck
          from: A
          target_datasource_uid: prometheus
        for: 0s

      # --- Secondi ---
      - uid: sagra-rec-salsiccia
        title: Consumo 1m — salsiccia
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              expr: 'clamp_min(((sum(sagra_qt_totale{id="43"}) or vector(0)) + (sum(sagra_qt_totale{id="44"}) or vector(0))) - ((sum(sagra_qt_totale{id="43"} offset 1m) or vector(0)) + (sum(sagra_qt_totale{id="44"} offset 1m) or vector(0))), 0) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
        record:
          metric: sagra:consumo_1m:salsiccia
          from: A
          target_datasource_uid: prometheus
        for: 0s

      - uid: sagra-rec-spiedini-pesce
        title: Consumo 1m — spiedini di pesce
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              expr: 'clamp_min((3 * (sum(sagra_qt_totale{id="411"}) or vector(0))) - (3 * (sum(sagra_qt_totale{id="411"} offset 1m) or vector(0))), 0) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
        record:
          metric: sagra:consumo_1m:spiedini_pesce
          from: A
          target_datasource_uid: prometheus
        for: 0s

      - uid: sagra-rec-fritto-misto
        title: Consumo 1m — fritto misto (cartoni)
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              expr: 'clamp_min(((sum(sagra_qt_totale{id="42"}) or vector(0)) / 13) - ((sum(sagra_qt_totale{id="42"} offset 1m) or vector(0)) / 13), 0) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
        record:
          metric: sagra:consumo_1m:fritto_misto
          from: A
          target_datasource_uid: prometheus
        for: 0s

      - uid: sagra-rec-tigelle
        title: Consumo 1m — tigelle
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              expr: 'clamp_min(((sum(sagra_qt_totale{id="58"}) or vector(0)) + (sum(sagra_qt_totale{id="59"}) or vector(0)) + (sum(sagra_qt_totale{id="60"}) or vector(0)) + (sum(sagra_qt_totale{id="176"}) or vector(0))) - ((sum(sagra_qt_totale{id="58"} offset 1m) or vector(0)) + (sum(sagra_qt_totale{id="59"} offset 1m) or vector(0)) + (sum(sagra_qt_totale{id="60"} offset 1m) or vector(0)) + (sum(sagra_qt_totale{id="176"} offset 1m) or vector(0))), 0) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
        record:
          metric: sagra:consumo_1m:tigelle
          from: A
          target_datasource_uid: prometheus
        for: 0s

      # --- Altri (gestore) ---
      - uid: sagra-rec-gnocco-fritto
        title: Consumo 1m — gnocco fritto
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              instant: true
              range: false
              expr: 'clamp_min(((sum(sagra_qt_totale{id="53"}) or vector(0)) + 2 * (sum(sagra_qt_totale{id="54"}) or vector(0)) + 2 * (sum(sagra_qt_totale{id="55"}) or vector(0)) + 2 * (sum(sagra_qt_totale{id="56"}) or vector(0))) - ((sum(sagra_qt_totale{id="53"} offset 1m) or vector(0)) + 2 * (sum(sagra_qt_totale{id="54"} offset 1m) or vector(0)) + 2 * (sum(sagra_qt_totale{id="55"} offset 1m) or vector(0)) + 2 * (sum(sagra_qt_totale{id="56"} offset 1m) or vector(0))), 0) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
        record:
          metric: sagra:consumo_1m:gnocco_fritto
          from: A
          target_datasource_uid: prometheus
        for: 0s
